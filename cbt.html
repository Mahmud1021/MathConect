
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathConect | CBT Examination</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7fc;
  color: #183153;
}
header {
  background: #0756b5;
  color: white;
  text-align: center;
  padding: 22px 12px;
}
main {
  max-width: 750px;
  margin: auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000012;
}
.info {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-weight: bold;
  color: #0756b5;
}
.option {
  display: block;
  background: #f3f7fc;
  padding: 12px;
  margin: 10px 0;
  border-radius: 7px;
  cursor: pointer;
}
.option input { margin-right: 8px; }
button, .link {
  background: #0756b5;
  color: white;
  padding: 11px 17px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  margin: 5px 3px;
}
button:disabled {
  background: #999;
  cursor: not-allowed;
}
.nav {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
#result { line-height: 1.8; }
.correct { color: green; }
.wrong { color: #c62828; }
footer {
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>

<header>
  <h1>MathConect CBT Examination</h1>
  <p>Test your Mathematics knowledge</p>
</header>

<main>
<section class="card" id="exam">
  <div class="info">
    <span id="progress">Question 1 of 10</span>
    <span id="timer">Time: 10:00</span>
  </div>

  <h2 id="question"></h2>
  <div id="options"></div>

  <div class="nav">
    <button id="previous" onclick="move(-1)">Previous</button>
    <button id="next" onclick="move(1)">Next</button>
  </div>

  <button onclick="submitExam()">Submit Examination</button>
  <p id="message"></p>
</section>

<section class="card" id="results" hidden>
  <h2>Examination Results</h2>
  <div id="result"></div>
  <button onclick="location.reload()">Try Again</button>
</section>

<a class="link" href="dashboard.html">Back to Dashboard</a>
<a class="link" href="courses.html">Courses</a>
</main>

<footer>
  © 2026 MathConect | Learn Mathematics Together
</footer>

<script>
const questions = [
  {
    q: "What is 5 + 7?",
    options: ["10", "11", "12", "13"],
    answer: 2
  },
  {
    q: "Solve: 2x + 4 = 10.",
    options: ["2", "3", "4", "5"],
    answer: 1
  },
  {
    q: "What is the derivative of x²?",
    options: ["x", "2x", "x³", "2"],
    answer: 1
  },
  {
    q: "What is the value of sin 30°?",
    options: ["1", "0", "1/2", "√3/2"],
    answer: 2
  },
  {
    q: "Find the mean of 2, 4, 6.",
    options: ["3", "4", "5", "6"],
    answer: 1
  },
  {
    q: "What is the determinant of [1 2; 3 4]?",
    options: ["2", "-2", "10", "4"],
    answer: 1
  },
  {
    q: "What is the distance between (0,0) and (3,4)?",
    options: ["3", "4", "5", "7"],
    answer: 2
  },
  {
    q: "Evaluate: 3² + 4².",
    options: ["12", "16", "20", "25"],
    answer: 3
  },
  {
    q: "What is the integral of 2x?",
    options: ["2", "x² + C", "2x² + C", "x + C"],
    answer: 1
  },
  {
    q: "What is the mode of 2, 3, 3, 4, 5?",
    options: ["2", "3", "4", "5"],
    answer: 1
  }
];

let current = 0;
let answers = Array(questions.length).fill(null);
let finished = false;
let remaining = 600;
let timerId = null;

function showQuestion() {
  const q = questions[current];

  document.getElementById("progress").textContent =
    `Question ${current + 1} of ${questions.length}`;

  document.getElementById("question").textContent = q.q;

  const options = document.getElementById("options");
  options.innerHTML = "";

  q.options.forEach((option, index) => {
    const label = document.createElement("label");
    label.className = "option";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "answer";
    radio.value = index;
    radio.checked = answers[current] === index;

    radio.addEventListener("change", () => {
      answers[current] = index;
    });

    label.appendChild(radio);
    label.append(" " + option);
    options.appendChild(label);
  });

  document.getElementById("previous").disabled = current === 0;
  document.getElementById("next").disabled =
    current === questions.length - 1;
}

function move(direction) {
  if (finished) return;
  current += direction;
  showQuestion();
}

function updateTimer() {
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;

  document.getElementById("timer").textContent =
    `Time: ${minutes}:${String(seconds).padStart(2, "0")}`;

  if (remaining <= 0) {
    clearInterval(timerId);
    submitExam();
    return;
  }

  remaining--;
}

function submitExam() {
  if (finished) return;

  const unanswered = answers.filter(a => a === null).length;

  if (unanswered > 0 && remaining > 0) {
    const confirmSubmit = confirm(
      `You have ${unanswered} unanswered questions. Submit anyway?`
    );
    if (!confirmSubmit) return;
  }

  finished = true;
  clearInterval(timerId);

  let score = 0;

  questions.forEach((q, index) => {
    if (answers[index] === q.answer) score++;
  });

  const percentage = Math.round(score / questions.length * 100);

  document.getElementById("exam").hidden = true;
  document.getElementById("results").hidden = false;

  let review = "<h3>Answer Review</h3>";

  questions.forEach((q, index) => {
    const correct = answers[index] === q.answer;

    review += `
      <p class="${correct ? "correct" : "wrong"}">
        Question ${index + 1}: ${correct ? "Correct" : "Incorrect"}<br>
        Correct answer: ${q.options[q.answer]}<br>
        Your answer: ${
          answers[index] === null
          ? "Not answered"
          : q.options[answers[index]]
        }
      </p>
    `;
  });

  document.getElementById("result").innerHTML = `
    <h3>Your Score: ${score} / ${questions.length}</h3>
    <h3>Percentage: ${percentage}%</h3>
    ${review}
  `;
}

showQuestion();
updateTimer();
timerId = setInterval(updateTimer, 1000);
</script>

</body>
</html>
