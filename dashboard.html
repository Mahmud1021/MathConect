
<!DOCTYPE html>
<html lang="en">
<head>
  <nav>
  <a href="index.html">Home</a>
  <a href="login.html">Logout</a>
</nav>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathConect | Student Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f6fc;
      color: #183153;
    }
    header {
      background: #0756a5;
      color: white;
      padding: 22px;
    }
    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 22px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    a, button {
      display: inline-block;
      background: #0756a5;
      color: white;
      padding: 12px 18px;
      border: 0;
      border-radius: 7px;
      text-decoration: none;
      cursor: pointer;
    }
    button.logout { background: #b42318; }
  </style>
</head>
<body>
  <header>
    <h1>MathConect</h1>
    <p>Student Dashboard</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome!</h2>
      <p id="studentName">Checking your account...</p>
      <p id="studentEmail"></p>
    </div>

    <div class="card">
      <h2>My Learning</h2>
      <p>Explore mathematics learning resources.</p>
      <a href="courses.html">View Courses</a>
    </div>

    <div class="card">
      <h2>Practice</h2>
      <p>Prepare with computer-based practice.</p>
      <a href="index.html#contact">Explore MathConect</a>
    </div>

    <div class="card">
      <button class="logout" id="logoutBtn">Log Out</button>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD-Rq8jeNeGHNApk1fbbTKiSgDxHWKM5tI",
      authDomain: "mathconnect-b54be.firebaseapp.com",
      projectId: "mathconnect-b54be",
      storageBucket: "mathconnect-b54be.firebasestorage.app",
      messagingSenderId: "991575705508",
      appId: "1:991575705508:web:fb9c5d9790eb732389a331"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById("studentName").textContent =
          "Hello, " + (user.displayName || "Student");
        document.getElementById("studentEmail").textContent =
          user.email || "";
      } else {
        window.location.href = "register.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      auth.signOut().then(() => {
        window.location.href = "register.html";
      });
    });
  </script>
</body>
</html>
