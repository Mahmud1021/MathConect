
<!DOCTYPE html>
<html lang="en">
<head>
  <nav>
  <a href="index.html">Home</a>
  <a href="login.html">Login</a>
</nav>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | MathConect</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f0f6ff;
  color: #102b50;
}

.container {
  max-width: 460px;
  margin: 25px auto;
  padding: 28px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 5px 25px #102b5015;
}

.logo {
  text-align: center;
  color: #1264d8;
  font-size: 27px;
  font-weight: bold;
}

h2, .subtitle {
  text-align: center;
}

.subtitle {
  color: #64748b;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 7px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
  background: white;
}

input:focus, select:focus {
  outline: 2px solid #1264d8;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  border: none;
  border-radius: 7px;
  background: #1264d8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#message {
  display: none;
  padding: 12px;
  margin-top: 18px;
  border-radius: 7px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.success {
  display: block !important;
  background: #e4f8ed;
  color: #166534;
}

.error {
  display: block !important;
  background: #feecec;
  color: #b91c1c;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #1264d8;
  text-decoration: none;
}

.note {
  font-size: 12px;
  color: #64748b;
  margin-top: 18px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">MathConect.</div>

  <h2>Create Student Account</h2>

  <p class="subtitle">
    Join our mathematics learning community.
  </p>

  <form id="registrationForm">

    <label for="fullname">Full Name</label>
    <input id="fullname" type="text"
      placeholder="Enter full name" required minlength="2">

    <label for="email">Email Address</label>
    <input id="email" type="email"
      placeholder="Enter email address" required>

    <label for="institution">University / Institution</label>
    <input id="institution" type="text"
      placeholder="Enter institution" required>

    <label for="course">Select Course</label>
    <select id="course" required>
      <option value="">Choose a course</option>
      <option>Pure Mathematics</option>
      <option>Statistics</option>
      <option>Physics</option>
      <option>Computer Science</option>
      <option>Other</option>
    </select>

    <label for="password">Password</label>
    <input id="password" type="password"
      placeholder="At least 6 characters"
      minlength="6" required>

    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password"
      placeholder="Enter password again" required>

    <button id="registerButton" type="submit">
      Create Account
    </button>

  </form>

  <div id="message" role="status"></div>

  <p class="note">
    Your password is handled by Firebase Authentication.
    Keep it private. Institution and course details are
    not yet saved to a student profile database.
  </p>

  <a href="index.html" class="back">
    ← Back to Homepage
  </a>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD-Rq8jeNeGHNApk1fbbTKiSgDxHWKM5tI",
  authDomain: "mathconnect-b54be.firebaseapp.com",
  projectId: "mathconnect-b54be",
  storageBucket: "mathconnect-b54be.firebasestorage.app",
  messagingSenderId: "991575705508",
  appId: "1:991575705508:web:fb9c5d9790eb732389a331"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const form = document.getElementById("registrationForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const name = document.getElementById("fullname").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password.length < 6) {
    showMessage(
      "Password must contain at least 6 characters.",
      "error"
    );
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Your passwords do not match.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "Creating account...";

  try {
    const result = await auth.createUserWithEmailAndPassword(
      email,
      password
    );

    await result.user.updateProfile({
      displayName: name
    });

    await result.user.sendEmailVerification();

    showMessage(
      "Account created successfully! Please check your email " +
      "and click the verification link. Your name is saved in " +
      "your Firebase account.",
      "success"
    );

    form.reset();

  } catch (error) {
    const messages = {
      "auth/email-already-in-use":
        "This email already has an account. Please log in.",

      "auth/invalid-email":
        "Please enter a valid email address.",

      "auth/weak-password":
        "Please choose a stronger password.",

      "auth/network-request-failed":
        "Network problem. Check your internet and try again."
    };

    showMessage(
      messages[error.code] ||
      "Registration failed: " + error.message,
      "error"
    );

  } finally {
    button.disabled = false;
    button.textContent = "Create Account";
  }
});
</script>

</body>
</html>
