
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathConect Student Registration</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f6fc;
      margin: 0;
      padding: 25px 12px;
      color: #183153;
    }

    .container {
      max-width: 420px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }

    h1 { color: #0756a5; }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 7px;
      font-size: 15px;
    }

    input { border: 1px solid #bbb; }

    button {
      background: #0756a5;
      color: white;
      border: none;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    a { color: #0756a5; }
  </style>
</head>

<body>
  <div class="container">
    <h1>MathConect</h1>
    <h2>Create Student Account</h2>

    <form id="registerForm">
      <input id="name" type="text"
        placeholder="Full Name" required>

      <input id="email" type="email"
        placeholder="Email Address" required>

      <input id="university" type="text"
        placeholder="University" required>

      <input id="course" type="text"
        placeholder="Course of Study" required>

      <input id="password" type="password"
        placeholder="Password (minimum 6 characters)"
        minlength="6" required>

      <input id="confirmPassword" type="password"
        placeholder="Confirm Password" required>

      <button type="submit" id="registerBtn">
        Create Account
      </button>
    </form>

    <p id="message" role="status"></p>

    <p>Already registered?
      <a href="login.html">Login here</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD-Rq8jeNeGHNApk1fbbTKiSgDxHWKM5tI",
      authDomain: "mathconnect-b54be.firebaseapp.com",
      projectId: "mathconnect-b54be",
      storageBucket: "mathconnect-b54be.firebasestorage.app",
      messagingSenderId: "991575705508",
      appId: "1:991575705508:web:fb9c5d9790eb732389a331"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerBtn = document.getElementById("registerBtn");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const university = document.getElementById("university").value.trim();
      const course = document.getElementById("course").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 6) {
        message.textContent = "Password must contain at least 6 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      registerBtn.disabled = true;
      message.textContent = "Creating your account...";

      let user = null;

      try {
        const credential = await auth.createUserWithEmailAndPassword(
          email, password
        );

        user = credential.user;

        await user.updateProfile({
          displayName: name
        });

        await db.collection("students").doc(user.uid).set({
          fullName: name,
          email: email,
          university: university,
          course: course,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        message.textContent =
          "Account and student profile created successfully! Sending verification email...";

        try {
          await user.sendEmailVerification();
          message.textContent =
            "Success! Your MathConect account and student profile have been saved. Please check your email for verification.";
        } catch (emailError) {
          message.textContent =
            "Your account and profile are saved, but the verification email could not be sent. You can request it again later.";
        }

        form.reset();

      } catch (error) {
        if (user) {
          message.textContent =
            "Your account may already exist, but the profile could not be saved. Error: " +
            error.message +
            ". Do not register again yet; check Firebase Authentication and Firestore.";
        } else if (error.code === "auth/email-already-in-use") {
          message.textContent = "This email already has an account. Please login.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email address.";
        } else if (error.code === "auth/weak-password") {
          message.textContent = "Please choose a stronger password.";
        } else {
          message.textContent = "Registration error: " + error.message;
        }
      } finally {
        registerBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
